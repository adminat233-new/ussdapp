name: Signed production releases

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable vMAJOR.MINOR.PATCH tag pointing to the current main commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.validate.outputs.release_tag }}
      commit_sha: ${{ steps.validate.outputs.commit_sha }}
    steps:
      - name: Check out the selected main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify dispatch source and release tag
        id: validate
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" || "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production releases must be dispatched from main." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Use a stable vMAJOR.MINOR.PATCH tag; preview tags are not production releases." >&2
            exit 1
          fi

          git fetch --force origin main --no-tags
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          tag_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "$GITHUB_SHA" != "$main_sha" ]]; then
            echo "main advanced after dispatch. Re-run the workflow from the current main commit." >&2
            exit 1
          fi
          if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "The release tag must point exactly to the selected main commit." >&2
            exit 1
          fi

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  windows-build:
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Check out validated source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}

      - name: Build Windows app and wake agent
        shell: cmd
        run: |
          set TEMP=%RUNNER_TEMP%
          set TMP=%RUNNER_TEMP%
          call Csharp\build.bat
          if errorlevel 1 exit /b 1
          call Csharp\build_agent.bat
          if errorlevel 1 exit /b 1

      - name: Set up Node for Windows calling companion
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: DesktopCalls/package-lock.json

      - name: Build Windows LiveKit calling companion
        working-directory: DesktopCalls
        run: |
          npm ci
          npm test
          npm run pack:win

      - name: Package unsigned Windows bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path windows-bundle -Force | Out-Null
          Copy-Item Csharp\UssdApp.exe,Csharp\UssdAgent.exe,Csharp\UssdApp.ico -Destination windows-bundle
          New-Item -ItemType Directory -Path windows-bundle\USSDCalls -Force | Out-Null
          Copy-Item DesktopCalls\release\win-unpacked\* -Destination windows-bundle\USSDCalls -Recurse -Force
          Compress-Archive -Path windows-bundle\* -DestinationPath USSDManager-Windows-unsigned.zip -Force

      - name: Upload unsigned Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: USSDManager-Windows-unsigned.zip
          if-no-files-found: error

  windows-sign:
    needs:
      - validate
      - windows-build
    runs-on: windows-latest
    environment:
      name: production-release
    steps:
      - name: Download unsigned Windows bundle
        uses: actions/download-artifact@v4
        with:
          name: windows-unsigned
          path: windows-package

      - name: Validate Windows signing secret and prepare certificate
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          foreach ($name in @("WINDOWS_SIGNING_PFX_BASE64", "WINDOWS_SIGNING_PFX_PASSWORD")) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required signing secret is missing: $name"
            }
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "ussdapp-windows-signing.pfx"
          $encoded = $env:WINDOWS_SIGNING_PFX_BASE64 -replace '\s', ''
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($encoded))
          } catch {
            throw "WINDOWS_SIGNING_PFX_BASE64 must contain a valid base64-encoded PFX."
          }
          "WINDOWS_SIGNING_CERTIFICATE_PATH=$certificatePath" >> $env:GITHUB_ENV

      - name: Sign and verify Windows executables
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE "windows-package\USSDManager-Windows-unsigned.zip"
          $bundle = Join-Path $env:GITHUB_WORKSPACE "windows-bundle"
          Expand-Archive -LiteralPath $archive -DestinationPath $bundle -Force

          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
          $signTool = Get-ChildItem -Path $sdkRoot -Filter signtool.exe -Recurse |
            Where-Object { $_.Directory.Name -eq "x64" } |
            Sort-Object FullName |
            Select-Object -Last 1
          if (-not $signTool) { throw "Windows SDK signtool.exe was not found." }

          $binaries = Get-ChildItem $bundle -Filter *.exe -Recurse |
            Select-Object -ExpandProperty FullName
          if (-not $binaries -or $binaries.Count -lt 1) {
            throw "The Windows bundle contains no executables to sign."
          }
          foreach ($binary in $binaries) {
            & $signTool.FullName sign /f $env:WINDOWS_SIGNING_CERTIFICATE_PATH /p $env:WINDOWS_SIGNING_PFX_PASSWORD /fd SHA256 /tr https://timestamp.digicert.com /td SHA256 $binary
            if ($LASTEXITCODE -ne 0) { throw "Signing failed for $binary" }
            & $signTool.FullName verify /pa /all $binary
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $binary" }
          }

          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Compress-Archive -Path (Join-Path $bundle "*") -DestinationPath release-assets\USSDManager-Windows.zip -Force

      - name: Remove Windows signing certificate
        if: always()
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "ussdapp-windows-signing.pfx"
          if (Test-Path $certificatePath) { Remove-Item -LiteralPath $certificatePath -Force }

      - name: Upload signed Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: windows-signed
          path: release-assets/USSDManager-Windows.zip
          if-no-files-found: error

  android-build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build unsigned Android APK and Play bundle
        working-directory: Mobile/Android
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          VERSION_NAME="${RELEASE_TAG#v}"
          VERSION_CODE="$((GITHUB_RUN_NUMBER + 3))"
          ./gradlew --no-daemon --max-workers=2 \
            -PreleaseVersionCode="$VERSION_CODE" \
            -PreleaseVersionName="$VERSION_NAME" \
            :app:assembleRelease :app:bundleRelease

          mkdir -p unsigned-android
          cp app/build/outputs/apk/release/app-release.apk unsigned-android/app-release-unsigned.apk
          cp app/build/outputs/bundle/release/app-release.aab unsigned-android/app-release.aab

      - name: Upload unsigned Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-unsigned
          path: Mobile/Android/unsigned-android/
          if-no-files-found: error

  android-sign:
    needs:
      - validate
      - android-build
    runs-on: ubuntu-latest
    environment:
      name: production-release
    steps:
      - name: Download unsigned Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-unsigned
          path: unsigned-android

      - name: Sign and verify Android release artifacts
        shell: bash
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_SIGNING_KEYSTORE_BASE64 ANDROID_SIGNING_STORE_PASSWORD ANDROID_SIGNING_KEY_ALIAS ANDROID_SIGNING_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required signing secret is missing: $name" >&2
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/ussdapp-release.jks"
          if ! printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"; then
            echo "ANDROID_SIGNING_KEYSTORE_BASE64 must contain a valid base64-encoded keystore." >&2
            exit 1
          fi
          chmod 600 "$KEYSTORE_PATH"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          mkdir -p release-assets
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$ANDROID_SIGNING_KEY_ALIAS" \
            --ks-pass env:ANDROID_SIGNING_STORE_PASSWORD \
            --key-pass env:ANDROID_SIGNING_KEY_PASSWORD \
            --out release-assets/USSDManager-Android.apk \
            unsigned-android/app-release-unsigned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs release-assets/USSDManager-Android.apk

          jarsigner \
            -keystore "$KEYSTORE_PATH" \
            -storepass:env ANDROID_SIGNING_STORE_PASSWORD \
            -keypass:env ANDROID_SIGNING_KEY_PASSWORD \
            unsigned-android/app-release.aab \
            "$ANDROID_SIGNING_KEY_ALIAS"
          cp unsigned-android/app-release.aab release-assets/USSDManager-Android.aab
          AAB_RESULT="$(jarsigner -verify unsigned-android/app-release.aab 2>&1)"
          printf '%s\n' "$AAB_RESULT"
          if ! grep -qi "jar verified" <<<"$AAB_RESULT"; then
            echo "The Android App Bundle does not have a verified signature." >&2
            exit 1
          fi

      - name: Remove Android signing keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/ussdapp-release.jks"

      - name: Upload signed Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-signed
          path: |
            release-assets/USSDManager-Android.apk
            release-assets/USSDManager-Android.aab
          if-no-files-found: error

  publish:
    needs:
      - validate
      - windows-sign
      - android-sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out validated source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
          fetch-depth: 0

      - name: Recheck release tag before publishing
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          VALIDATED_SHA: ${{ needs.validate.outputs.commit_sha }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "$tag_sha" != "$VALIDATED_SHA" ]]; then
            echo "The release tag moved after validation; refusing to publish." >&2
            exit 1
          fi

      - name: Download signed Windows bundle
        uses: actions/download-artifact@v4
        with:
          name: windows-signed
          path: release-assets

      - name: Download signed Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-signed
          path: release-assets

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            release-assets/USSDManager-Windows.zip \
            release-assets/USSDManager-Android.apk \
            release-assets/USSDManager-Android.aab \
            --repo "$GITHUB_REPOSITORY" \
            --title "USSD Manager $RELEASE_TAG" \
            --notes "Signed stable release. Windows download is a ZIP containing USSD Manager, its wake agent, and the LiveKit call companion. Android APK is signed for direct installation; AAB is for Google Play submission. Cross-device calling still requires a deployed calling service and verified device/network interoperability. Tracker, relay, and AI services must be configured separately. Release source: $RELEASE_TAG" \
            --verify-tag \
            --latest
