name: iOS build

on:
  pull_request:
    paths:
      - "Mobile/iOS/**"
      - ".github/workflows/ios-ci.yml"
  push:
    branches:
      - main
    paths:
      - "Mobile/iOS/**"
      - ".github/workflows/ios-ci.yml"

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve Swift packages
        working-directory: Mobile/iOS
        run: xcodebuild -resolvePackageDependencies -project UssdMobile.xcodeproj -scheme USSDManager

      - name: Build for iOS Simulator
        working-directory: Mobile/iOS
        run: >-
          xcodebuild build
          -project UssdMobile.xcodeproj
          -scheme USSDManager
          -configuration Debug
          -destination "generic/platform=iOS Simulator"
          CODE_SIGNING_ALLOWED=NO
