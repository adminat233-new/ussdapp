plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

def releaseVersionCode = (project.findProperty("releaseVersionCode") ?: "7").toString().toInteger()
def releaseVersionName = (project.findProperty("releaseVersionName") ?: "4.0.6").toString()

android {
    namespace "com.ussdapp.mobile"
    compileSdk 34

    defaultConfig {
        applicationId "com.ussdapp.mobile"
        minSdk 26
        targetSdk 34
        versionCode releaseVersionCode
        versionName releaseVersionName
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
            storeFile file(keystorePath ?: "missing-release-key.jks")
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: ""
            keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
    }

    sourceSets { main.java.srcDirs += ["../src/main/java"] }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = "1.8" }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
    implementation "io.livekit:livekit-android:2.30.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.0"
}
